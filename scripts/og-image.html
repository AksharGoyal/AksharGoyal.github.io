<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Graph image</title>
    <link rel="stylesheet" href="../css/tokens.css" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../assets/fonts/jetbrains-mono-variable.woff2")
          format("woff2");
        font-weight: 100 800;
      }

      body {
        display: grid;
        align-content: center;
        gap: var(--space-4);
        width: 1200px;
        height: 630px;
        margin: 0;
        padding-inline: 96px;
        font-family: var(--font-mono);
        color: var(--color-text);
        background:
          radial-gradient(circle at 85% 15%, var(--glow-3), transparent 45%),
          radial-gradient(circle at 10% 95%, var(--glow-1), transparent 45%),
          var(--color-bg);
      }

      h1 {
        margin: 0;
        font-size: 112px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--color-heading);
      }

      p {
        margin: 0;
        font-size: 36px;
        line-height: 1.3;
      }

      .url {
        font-size: 28px;
        color: var(--color-muted);
      }
    </style>
  </head>
  <body>
    <h1>Akshar Goyal</h1>
    <p>Web scraping, data pipelines and monitoring.</p>
    <p class="url">akshargoyal.github.io</p>
  </body>
</html>
